name: CI

# Vérifie chaque PR vers main avant fusion : la fusion déclenche
# directement le déploiement en prod (deploy.yml).
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Un nouveau push sur la PR annule la vérification en cours.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  server:
    name: Serveur (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # Base des tests d'intégration (src/db_tests) : même moteur qu'en prod.
    # Chaque test y crée sa propre base et y applique les migrations.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: farm
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Même version que l'image de build (Dockerfile).
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server

      - name: Formatage
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests (unitaires et sur base)
        run: cargo test --locked -- --include-ignored
        env:
          DATABASE_URL: mysql://root:test@127.0.0.1:3306/farm

  client:
    name: Client (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Dépendances
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Déploie la PR sur https://sellier-test.duckdns.org une fois les
  # vérifications passées. Branches du dépôt uniquement : une PR venant d'un
  # fork n'a pas accès aux secrets et n'exécute rien sur le serveur. Les PR de
  # Dependabot non plus : elles changent justement les actions qui reçoivent
  # les secrets, et se vérifient en relisant le changement avant la fusion.
  preprod:
    name: Déploiement préprod
    needs: [server, client]
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Une seule préprod : les déploiements de PR différentes passent l'un
    # après l'autre, le dernier l'emporte.
    concurrency:
      group: preprod
      cancel-in-progress: false

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # ssh du runner plutôt qu'une action tierce : la clé de déploiement ne
      # passe par aucun code extérieur, et la clé du serveur est vérifiée
      # (clé publique ED25519 ci-dessous, à remplacer si le serveur est
      # réinstallé). Seuls le numéro de PR et le SHA, contrôlés avant usage,
      # sont transmis au script, jamais le nom de branche.
      - name: Deploy via SSH
        timeout-minutes: 20
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ $PR_NUMBER =~ ^[0-9]+$ && $PR_SHA =~ ^[0-9a-f]{40}$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          echo "serveur ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPzmXXs+FxgRBCciykz9TNeW0gGQi2kz/OuNBmq8Q6H0" > ~/.ssh/known_hosts_serveur
          ssh -i ~/.ssh/deploiement -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o HostKeyAlias=serveur \
            -o UserKnownHostsFile=~/.ssh/known_hosts_serveur -o UpdateHostKeys=no \
            -o ServerAliveInterval=30 \
            "$SSH_USER@$SSH_HOST" "set -eu
          cd ~/stacks/site-preprod/app
          git fetch -q origin refs/pull/$PR_NUMBER/head
          git checkout -q --detach $PR_SHA
          deploy/deploie.sh"
