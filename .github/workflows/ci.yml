name: CI

# Vérifie chaque PR vers main avant fusion : la fusion déclenche
# directement le déploiement en prod (deploy.yml).
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Un nouveau push sur la PR annule la vérification en cours.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  server:
    name: Serveur (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      # Même version que l'image de build (Dockerfile).
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Formatage
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

  client:
    name: Client (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Dépendances
        run: npm ci

      - name: Build
        run: npm run build

  # Déploie la PR sur https://sellier-test.duckdns.org une fois les
  # vérifications passées. Branches du dépôt uniquement : une PR venant d'un
  # fork n'a pas accès aux secrets et n'exécute rien sur le serveur.
  preprod:
    name: Déploiement préprod
    needs: [server, client]
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Une seule préprod : les déploiements de PR différentes passent l'un
    # après l'autre, le dernier l'emporte.
    concurrency:
      group: preprod
      cancel-in-progress: false

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # Seuls le numéro de PR et le SHA (valeurs sûres) sont injectés dans le
      # script, jamais le nom de branche.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -eu
            cd ~/site-preprod/app
            git fetch -q origin "refs/pull/${{ github.event.pull_request.number }}/head"
            git checkout -q --detach "${{ github.event.pull_request.head.sha }}"
            deploy/deploie.sh
