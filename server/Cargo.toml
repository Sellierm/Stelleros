[package]
name = "farm-server"
version = "1.0.0"
edition = "2024"
description = "Farm management – Rust API (axum + socketioxide)"
authors = ["Mathieu"]
license = "ISC"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
bcrypt = "0.17"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
dotenvy = "0.15"
form_urlencoded = "1"
hmac = "0.12"
http = "1"
percent-encoding = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
socketioxide = { version = "0.18", features = ["extensions", "state"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "chrono", "macros", "migrate"] }
subtle = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
